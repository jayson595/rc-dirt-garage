<!doctype html><html><body style="margin:0;background:#222"><canvas id="c" style="width:1500px;height:1000px"></canvas>
<script type="module">
import * as THREE from 'three';
import { createCrawler, CRAWLER_STYLES } from '../src/assets/crawlerModel.ts';
import { createMonster } from '../src/assets/monsterModel.ts';

const kits = JSON.parse(Q.get('kits') || '[{},{},{}]');

</script></body></html>
